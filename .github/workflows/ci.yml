name: CI

on:
  pull_request:
  push:
    paths-ignore:
      - '**.md'
      - '**.org'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs-version: '31.1'
            experimental: false
          - emacs-version: snapshot
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Identify Emacs build
        id: emacs
        run: |
          emacs --version
          emacs -Q --batch --eval \
            '(princ (format "build=%s-%s\n" emacs-version (or emacs-repository-version "release")))' \
            >> "$GITHUB_OUTPUT"

      - name: Test CI error handling
        run: emacs -Q --batch -l .github/check-init-tests.el -f ert-run-tests-batch-and-exit

      - name: Cache ELPA packages
        uses: actions/cache@v4
        with:
          path: elpa
          key: ${{ runner.os }}-${{ runner.arch }}-emacs-${{ steps.emacs.outputs.build }}-elpa-v2-${{ hashFiles('init.el', 'early-init.el', 'lisp/**/*.el', 'user-lisp/**', '.github/check-init.el', '.github/workflows/ci.yml') }}

      # Always activate existing packages and ensure missing ones, even on a hit.
      - name: Check startup (install missing packages)
        run: emacs -Q --batch -l .github/check-init.el -f ci-check-init
